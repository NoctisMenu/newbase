<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nimbus Menu</title>
<style>
  :root{
    --accent:      #8b5cf6;
    --accent-br:   #a385ff;
    --accent-soft: rgba(139,92,246,0.16);

    --panel-top:   rgba(33,27,44,0.86);
    --panel-bot:   rgba(20,16,27,0.86);
    --card:        rgba(255,255,255,0.028);
    --card-hover:  rgba(255,255,255,0.055);
    --border:      rgba(255,255,255,0.065);
    --border-str:  rgba(255,255,255,0.12);

    --text:        #f2f1f6;
    --text-dim:    #928d9d;
    --text-faint:  #6c6678;

    --pop:         #1b1626;
    --radius:      26px;
    --card-radius: 12px;

    --spring:      cubic-bezier(.2,.9,.25,1);
    --spring-back: cubic-bezier(.33,1.06,.5,1);
  }

  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:'Geist','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    color:var(--text);
    display:flex;align-items:center;justify-content:center;
    background:transparent;               /* overlay: game shows through */
    overflow:hidden;
  }

  /* ─────────────────────────  ENTRANCE  ─────────────────────────── */
  @keyframes panelIn{
    from{opacity:0;transform:translateY(16px) scale(.975)}
    to  {opacity:1;transform:none}
  }
  /* Insert-toggle : bubbly expand open, shrink + fade close */
  @keyframes menuOpen{
    0%  {opacity:0;transform:scale(.8)}
    55% {opacity:1;transform:scale(1.03)}
    100%{opacity:1;transform:scale(1)}
  }
  @keyframes menuClose{
    0%  {opacity:1;transform:scale(1)}
    100%{opacity:0;transform:scale(.86)}
  }
  @keyframes cloudReveal{
    0%{opacity:0;transform:scale(.58);filter:blur(38px)}
    28%{opacity:.78}
    72%{opacity:.42}
    100%{opacity:0;transform:scale(1.34);filter:blur(64px)}
  }
  @keyframes valueSettle{0%{transform:scale(1.08)}55%{transform:scale(.97)}100%{transform:none}}
  @keyframes boundaryPulse{50%{box-shadow:0 0 0 4px var(--accent-soft),inset 0 0 12px var(--accent-soft)}}
  @keyframes cardIn{
    from{opacity:0;transform:translateY(9px)}
    to  {opacity:1;transform:none}
  }
  @keyframes rowIn{
    from{opacity:0;transform:translateX(8px)}
    to  {opacity:1;transform:none}
  }
  @keyframes itemIn{
    from{opacity:0;transform:translateY(7px)}
    to  {opacity:1;transform:none}
  }
  @keyframes searchIn{
    from{opacity:0;transform:translate(-50%,-12px) scale(.95)}
    to  {opacity:1;transform:translate(-50%,0) scale(1)}
  }
  @keyframes descIn{
    from{opacity:0;transform:translateY(3px)}
    to  {opacity:1;transform:none}
  }

  /* ─────────────────────────  MAIN PANEL  ───────────────────────── */
  .stage{position:relative;isolation:isolate}
  .stage::before,.stage::after{content:'';position:absolute;z-index:0;pointer-events:none;
    inset:-90px -120px;border-radius:45%;opacity:0}
  .stage::before{background:
    radial-gradient(ellipse at 24% 54%,rgba(255,255,255,.22) 0 12%,var(--accent-soft) 32%,transparent 67%),
    radial-gradient(ellipse at 70% 42%,var(--accent-soft) 0 20%,rgba(255,255,255,.12) 40%,transparent 70%)}
  .stage::after{inset:-60px -80px;background:
    radial-gradient(ellipse at 52% 45%,rgba(255,255,255,.15),var(--accent-soft) 38%,transparent 72%)}
  .stage.cloud-opening::before{animation:cloudReveal .72s ease-out both}
  .stage.cloud-opening::after{animation:cloudReveal .62s ease-out .08s both}
  .panel{
    position:relative;z-index:1;
    width:min(960px,92vw);
    background:linear-gradient(160deg, var(--panel-top), var(--panel-bot));
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:
      0 40px 120px -20px rgba(0,0,0,0.65),
      inset 0 1px 0 rgba(255,255,255,0.06);
    overflow:hidden;
    -webkit-backdrop-filter:blur(22px) saturate(140%);
    backdrop-filter:blur(22px) saturate(140%);
    animation:panelIn .55s var(--spring) both;
  }

  .top{
    display:grid;grid-template-columns:236px 1fr;align-items:center;
    padding:18px 20px 16px;gap:6px;
  }
  .brand{display:flex;align-items:center;gap:12px}
  .brand .logo{
    width:44px;height:44px;border-radius:12px;flex-shrink:0;
    background:radial-gradient(circle at 30% 25%,#3a3348,#171320);
    border:1px solid var(--border-str);
    display:flex;align-items:center;justify-content:center;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.08);overflow:hidden;
    transition:transform .3s var(--spring-back);
  }
  .brand .logo:hover{transform:rotate(-6deg) scale(1.06)}
  .brand .logo svg{width:30px;height:30px;opacity:.92}
  .brand .name{font-size:17px;font-weight:700;letter-spacing:-0.01em;line-height:1.15}
  .brand .ver{font-size:11px;color:var(--text-faint);margin-top:2px}

  .topbar{display:flex;align-items:center;gap:12px;padding-left:8px}
  .topbar .cat-ico{width:19px;height:19px;color:var(--text);flex-shrink:0;display:inline-flex}
  .topbar .cat-ico svg{width:19px;height:19px}
  .topbar .cat-name{font-size:15px;font-weight:600}
  .topbar .sep{color:var(--text-faint);font-size:13px}
  .topbar .cat-desc{font-size:13px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .topbar .cat-desc.anim{animation:descIn .26s ease both}
  .topbar .search-btn,.topbar .theme-btn{
    margin-left:auto;width:34px;height:34px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    border-radius:9px;color:var(--text-dim);cursor:pointer;
    transition:background .15s, color .15s, transform .15s var(--spring-back);
  }
  .topbar .search-btn:hover,.topbar .theme-btn:hover{background:var(--card-hover);color:var(--text)}
  .topbar .search-btn:active,.topbar .theme-btn:active{transform:scale(.86)}
  .topbar .search-btn svg,.topbar .theme-btn svg{width:17px;height:17px}
  .topbar .theme-btn{margin-left:auto}
  .topbar .search-btn{margin-left:0}

  .divider{height:1px;background:var(--border);margin:0 20px}

  .body{display:grid;grid-template-columns:236px 1fr;
    transition:filter .3s ease, opacity .3s ease}

  /* ───────────  SIDEBAR  ─────────── */
  .side{
    position:relative;
    padding:16px 16px 14px 20px;
    display:flex;flex-direction:column;
    border-right:1px solid var(--border);
    min-height:520px;
  }
  .side .grp{font-size:10.5px;font-weight:600;letter-spacing:.09em;
    color:var(--text-faint);text-transform:uppercase;margin:10px 8px 6px}
  .side .grp:first-child{margin-top:0}

  .nav-ind{
    position:absolute;left:20px;top:0;width:0;height:0;border-radius:11px;
    background:linear-gradient(180deg,var(--accent-br),var(--accent));
    box-shadow:0 6px 18px -6px var(--accent), inset 0 1px 0 rgba(255,255,255,0.25);
    z-index:0;opacity:0;pointer-events:none;
    transition:top .34s var(--spring), left .34s var(--spring),
               width .34s var(--spring), height .34s var(--spring), opacity .2s;
  }
  .nav{
    position:relative;z-index:1;
    display:flex;align-items:center;gap:12px;
    padding:10px 12px;border-radius:11px;cursor:pointer;
    color:var(--text-dim);font-size:14px;font-weight:500;
    transition:color .16s, background .16s, transform .12s;
  }
  .nav svg{width:18px;height:18px;flex-shrink:0;transition:transform .2s var(--spring-back)}
  .nav:hover{color:var(--text)}
  .nav:hover:not(.active){background:rgba(255,255,255,0.04)}
  .nav:hover svg{transform:scale(1.12)}
  .nav:active{transform:scale(.97)}
  .nav.active{color:#fff;font-weight:600}
  .nav.active svg{color:#fff}

  .side .spacer{flex:1}
  .user{
    display:flex;align-items:center;gap:12px;padding:8px;margin-top:8px;
    border-top:1px solid var(--border);padding-top:16px;
  }
  .user .av{width:34px;height:34px;border-radius:50%;flex-shrink:0;overflow:hidden;
    border:1px solid var(--border-str);background:#000;box-shadow:0 0 0 2px var(--accent-soft)}
  .user .av img{width:100%;height:100%;display:block;object-fit:cover;image-rendering:pixelated}
  .user .u-name{font-size:13px;font-weight:600}
  .user .u-uid{font-size:11px;color:var(--text-faint);margin-top:1px}

  /* ───────────  CARD GRID  ─────────── */
  .grid{
    padding:16px 20px 20px;
    display:grid;grid-template-columns:1fr 1fr;gap:11px;
    align-content:start;max-height:520px;overflow-y:auto;
  }
  .grid::-webkit-scrollbar{width:7px}
  .grid::-webkit-scrollbar-thumb{background:var(--border-str);border-radius:4px}
  .grid::-webkit-scrollbar-track{background:transparent}

  .mod{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--card-radius);
    padding:13px 15px;cursor:pointer;
    position:relative;overflow:hidden;
    transition:background .15s, border-color .15s, transform .14s var(--spring-back), box-shadow .15s;
    animation:cardIn .34s var(--spring) both;
  }
  .mod:hover{background:var(--card-hover);border-color:var(--border-str);
    transform:translateY(-2px);box-shadow:0 10px 24px -14px rgba(0,0,0,.8)}
  .mod:active{transform:translateY(0) scale(.985)}
  .mod .t{font-size:14.5px;font-weight:600;letter-spacing:-0.005em}
  .mod .d{font-size:12px;color:var(--text-dim);margin-top:3px;line-height:1.35;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mod::before{
    content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
    background:linear-gradient(180deg,var(--accent-br),var(--accent));
    transform:scaleY(0);transform-origin:center;
    transition:transform .28s var(--spring-back);
  }
  .mod.on{border-color:var(--accent)}
  .mod.on::before{transform:scaleY(1)}
  /* clicked / selected module — lerps into a raised, highlighted state */
  .mod.selected{
    border-color:var(--accent);
    background:var(--accent-soft);
    transform:translateY(-3px) scale(1.04);
    box-shadow:0 20px 46px -18px var(--accent), 0 0 0 1px var(--accent-soft);
    z-index:4;
  }
  .mod.selected:hover{transform:translateY(-4px) scale(1.05)}
  .mod.selected::before{transform:scaleY(1)}
  .mod.selected .t{color:#fff}
  /* click ripple */
  .mod .ripple{
    position:absolute;border-radius:50%;pointer-events:none;
    background:radial-gradient(circle,var(--accent-soft) 0%,transparent 70%);
    transform:translate(-50%,-50%) scale(0);
    animation:ripple .5s ease-out forwards;
  }
  @keyframes ripple{to{transform:translate(-50%,-50%) scale(1);opacity:0}}

  /* ───────────  MODULE SETTINGS POPUP  ─────────── */
  .pop{
    position:absolute;top:74px;left:100%;margin-left:18px;width:244px;
    background:var(--pop);
    border:1px solid var(--border-str);
    border-radius:16px;
    box-shadow:0 30px 80px -20px rgba(0,0,0,0.75);
    padding:16px 18px;
    transform-origin:top left;
    opacity:0;transform:translateX(-14px) scale(.94);
    transition:opacity .24s ease, transform .34s var(--spring-back);
    pointer-events:none;z-index:25;
  }
  .pop.show{opacity:1;transform:translateX(0) scale(1);pointer-events:auto}
  .pop .p-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .pop.show .p-head{animation:rowIn .3s var(--spring) .04s both}
  .pop .p-title{font-size:15px;font-weight:600}
  .pop .p-x{width:22px;height:22px;display:flex;align-items:center;justify-content:center;
    border-radius:6px;color:var(--text-dim);cursor:pointer;
    transition:background .14s,color .14s,transform .2s var(--spring-back)}
  .pop .p-x:hover{background:var(--card-hover);color:var(--text);transform:rotate(90deg)}
  .pop .p-x svg{width:14px;height:14px}
  .p-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0}
  .pop.show .p-row{animation:rowIn .32s var(--spring) both}
  .pop.show .p-row:nth-of-type(1){animation-delay:.09s}
  .pop.show .p-row:nth-of-type(2){animation-delay:.15s}
  .pop.show .p-row:nth-of-type(3){animation-delay:.21s}
  .p-row .p-lbl{font-size:13.5px;color:var(--text)}
  .p-row .p-ext{color:var(--text-dim);cursor:pointer;transition:color .15s,transform .2s var(--spring-back)}
  .p-row .p-ext:hover{color:var(--text);transform:translate(1px,-1px)}
  .p-row .p-ext svg{width:16px;height:16px;display:block}
  .m-select{background:var(--card-hover);border:1px solid var(--border);color:var(--text);
    font:inherit;font-size:12.5px;border-radius:7px;padding:4px 8px;outline:none;cursor:pointer;max-width:128px}
  .m-select:focus{border-color:var(--accent)}
  .m-val{font-size:12.5px;color:var(--text-dim)}
  .m-drag{min-width:52px;padding:4px 7px;text-align:right;border-radius:7px;
    border:1px solid transparent;background:var(--card);cursor:ew-resize;user-select:none;
    font-variant-numeric:tabular-nums;transition:border-color .15s,background .15s,color .15s,transform .15s,box-shadow .15s}
  .m-drag:hover{color:var(--text);border-color:var(--border-str);background:var(--card-hover)}
  .m-drag.dragging{color:#fff;border-color:var(--accent);transform:scale(1.08);min-width:68px;
    background:
      repeating-linear-gradient(90deg,rgba(255,255,255,.16) 0 1px,transparent 1px 8px),
      linear-gradient(90deg,var(--accent-soft) 0 var(--value-progress,0%),rgba(255,255,255,.025) var(--value-progress,0%))}
  .m-drag.at-limit{animation:boundaryPulse .34s ease-in-out infinite alternate}
  .m-drag.settling{animation:valueSettle .24s var(--spring-back)}
  .dot{width:15px;height:15px;border-radius:50%;background:var(--accent);
    box-shadow:0 0 0 3px var(--accent-soft);cursor:pointer;
    transition:transform .2s var(--spring-back),box-shadow .2s}
  .dot:hover{transform:scale(1.15);box-shadow:0 0 0 5px var(--accent-soft)}

  .color-picker{position:fixed;z-index:90;width:196px;padding:14px;background:var(--pop);
    --picker-rgb:139,92,246;border:1px solid rgba(var(--picker-rgb),.48);border-radius:15px;
    box-shadow:0 26px 70px -18px rgba(0,0,0,.8),0 0 34px -8px rgba(var(--picker-rgb),.56);
    opacity:0;visibility:hidden;transform:translateY(-6px) scale(.96);transform-origin:top right;
    transition:opacity .16s,visibility .16s,transform .22s var(--spring)}
  .color-picker.show{opacity:1;visibility:visible;transform:none}
  .color-picker::before{content:'';position:absolute;z-index:-1;inset:-30px;border-radius:32px;pointer-events:none;
    background:radial-gradient(circle at 50% 42%,rgba(var(--picker-rgb),.3),transparent 68%);
    filter:blur(12px);opacity:.9;transition:background .12s}
  .cp-wheel-wrap{position:relative;width:168px;height:168px;user-select:none}
  .cp-wheel{display:block;width:168px;height:168px;border-radius:50%;cursor:crosshair}
  .cp-cursor{position:absolute;width:13px;height:13px;border:2px solid #fff;border-radius:50%;
    pointer-events:none;transform:translate(-50%,-50%);box-shadow:0 0 0 1px #000,0 2px 5px rgba(0,0,0,.5)}
  .cp-value{height:11px;margin-top:12px;border-radius:6px;position:relative;cursor:ew-resize;
    border:1px solid var(--border-str)}
  .cp-value::after{content:'';position:absolute;left:var(--value-pos,100%);top:50%;width:12px;height:16px;
    border:2px solid #fff;border-radius:6px;transform:translate(-50%,-50%);box-shadow:0 0 0 1px #000}
  .cp-footer{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
  .cp-label{font-size:11px;color:var(--text-faint)}
  .cp-hex{font-size:12px;color:var(--text);font-family:ui-monospace,SFMono-Regular,Consolas,monospace}

  /* toggle */
  .tog{width:38px;height:21px;border-radius:11px;background:rgba(255,255,255,0.14);
    position:relative;cursor:pointer;transition:background .25s;flex-shrink:0}
  .tog::after{content:'';position:absolute;top:2.5px;left:2.5px;width:16px;height:16px;
    border-radius:50%;background:#fff;
    transition:transform .3s var(--spring-back), width .15s ease;
    box-shadow:0 1px 3px rgba(0,0,0,.4)}
  .tog:active::after{width:20px}
  .tog.on{background:linear-gradient(180deg,var(--accent-br),var(--accent))}
  .tog.on::after{transform:translateX(17px)}

  /* ───────────  CARD ⇄ SETTINGS MORPH  ─────────── */
  /* one element that flies from the clicked card's slot and expands into the
     settings panel — a true shared-element transition */
  .morph{
    position:fixed;z-index:60;overflow:hidden;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--card-radius);
    padding:13px 15px;
    opacity:0;visibility:hidden;pointer-events:none;
    box-shadow:0 0 0 rgba(0,0,0,0);
    transition:
      top   .46s var(--spring-back), left  .46s var(--spring-back),
      width .46s var(--spring-back), height .46s var(--spring-back),
      padding .46s var(--spring-back),
      background .4s ease, border-color .4s ease, border-radius .4s ease, box-shadow .4s ease;
  }
  .morph.active{opacity:1;visibility:visible}
  .morph.settings{
    background:var(--pop);
    border-color:var(--border-str);
    border-radius:16px;
    box-shadow:0 30px 80px -20px rgba(0,0,0,0.75);
    padding:16px 18px;
    pointer-events:auto;
  }
  .m-title{font-size:14.5px;font-weight:600;letter-spacing:-0.005em;
    transition:font-size .35s var(--spring-back), color .3s, margin .4s ease}
  .morph.settings .m-title{font-size:15px;color:#fff;margin-bottom:14px}
  .m-desc{font-size:12px;color:var(--text-dim);margin-top:3px;max-height:20px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    transition:opacity .16s ease, max-height .4s ease, margin .4s ease}
  .morph.settings .m-desc{opacity:0;max-height:0;margin-top:0}
  .m-x{position:absolute;top:15px;right:16px;width:22px;height:22px;
    display:flex;align-items:center;justify-content:center;border-radius:6px;
    color:var(--text-dim);cursor:pointer;opacity:0;
    transition:opacity .25s ease .12s, background .14s, color .14s, transform .2s var(--spring-back)}
  .m-x:hover{background:var(--card-hover);color:var(--text);transform:rotate(90deg)}
  .m-x svg{width:14px;height:14px}
  .morph.settings .m-x{opacity:1}
  .m-body{opacity:0;max-height:0;overflow:hidden;transition:opacity .3s ease .06s}
  .morph.settings .m-body{opacity:1;max-height:320px}
  .morph.settings .m-body .p-row{animation:rowIn .34s var(--spring) both}
  .morph.settings .m-body .p-row:nth-of-type(1){animation-delay:.16s}
  .morph.settings .m-body .p-row:nth-of-type(2){animation-delay:.22s}
  .morph.settings .m-body .p-row:nth-of-type(3){animation-delay:.28s}

  /* ───────────  SEARCH OVERLAY  ─────────── */
  .search-wrap{position:absolute;inset:0;z-index:30;
    opacity:0;visibility:hidden;transition:opacity .25s ease, visibility .25s}
  .search-wrap::before{
    content:'';position:absolute;inset:0;
    background:rgba(8,6,12,0.5);
    -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  }
  .search-wrap.show{opacity:1;visibility:visible}
  .search-box{
    position:absolute;top:64px;left:50%;transform:translateX(-50%);
    width:420px;background:var(--pop);
    border:1px solid var(--border-str);border-radius:16px;
    box-shadow:0 30px 80px -20px rgba(0,0,0,0.7);
    padding:6px;overflow:hidden;
  }
  .search-wrap.show .search-box{animation:searchIn .3s var(--spring) both}
  .search-box input{
    width:100%;background:transparent;border:none;outline:none;
    color:var(--text);font:inherit;font-size:15px;padding:12px 14px;
  }
  .search-box input::placeholder{color:var(--text-faint)}
  .s-results{border-top:1px solid transparent;padding:0 6px;
    max-height:0;overflow:hidden;
    transition:max-height .3s var(--spring), padding .3s ease, border-color .3s}
  .s-results.show{max-height:340px;padding:8px 6px 6px;border-top-color:var(--border)}
  .s-results .lbl{font-size:11px;color:var(--text-faint);padding:4px 8px 6px}
  .s-item{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:9px;
    font-size:13.5px;cursor:pointer;transition:background .12s, transform .12s;
    animation:itemIn .26s ease both}
  .s-item:hover{background:var(--card-hover);transform:translateX(2px)}
  .s-item .cat{color:var(--text-dim)}
  .s-item .dotsep{color:var(--text-faint)}
  .s-empty{padding:14px;color:var(--text-faint);font-size:13px;text-align:center;
    animation:itemIn .26s ease both}

  .theme-panel{position:absolute;z-index:42;right:20px;top:70px;width:250px;
    padding:15px;background:var(--pop);border:1px solid var(--border-str);border-radius:15px;
    box-shadow:0 24px 70px -18px rgba(0,0,0,.75);opacity:0;visibility:hidden;
    transform:translateY(-8px) scale(.96);transform-origin:top right;

window.__newbaseSetFps   = fps => { const el=document.getElementById('fps-hud'); if(el) el.textContent=(Math.max(0,+fps||0)).toFixed(0)+' fps'; };
window.__newbasePushLogs = () => {};
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

I.default = '<rect x="4" y="4" width="16" height="16" rx="5"/>';

/* ── data (config schema, injected by Rust) ──────────────────── */

const PROFILE_AVATAR = window.__NIMBUS_AVATAR || '';
const MODS = {};
DATA.categories.forEach(c => { MODS[c.id] = c.modules || []; });
function iconFor(catId){ const c=CATS.find(x=>x.id===catId); const k=(c&&c.icon)||catId; return I[k]||I[catId]||I.default; }

if(window.__GRIM_DATA){
  const bn=document.getElementById('brandName'); if(bn && window.__GRIM_DATA.brand) bn.textContent=window.__GRIM_DATA.brand;
  const bv=document.getElementById('brandVer'); if(bv && window.__GRIM_DATA.version) bv.textContent='Version: '+window.__GRIM_DATA.version;
}

/* ── state ───────────────────────────────────────────────────── */
let active = (CATS[0] && CATS[0].id) || '';

const side   = document.getElementById('side');
const ind    = document.getElementById('navInd');
const grid   = document.getElementById('grid');
const catDescEl = document.getElementById('catDesc');

/* ── sidebar (built once; indicator slides) ──────────────────── */
function renderSide(){
  let html = '<div class="grp">Features</div>';
  CATS.forEach(c=>{
    html+=`<div class="nav ${c.id===active?'active':''}" data-cat="${esc(c.id)}">${svg(iconFor(c.id))}<span>${esc(c.name)}</span></div>`;
  });

    <div class="user">
      <div class="av"><img src="${PROFILE_AVATAR}" alt="fr0st"></div>

    </div>`;

  side.querySelectorAll('.nav').forEach(n=>{
    n.onclick = ()=> setActive(n.dataset.cat);
  });
}
function moveIndicator(){
  const el = side.querySelector('.nav.active');

  ind.style.left   = el.offsetLeft + 'px';
  ind.style.width  = el.offsetWidth + 'px';
  ind.style.height = el.offsetHeight + 'px';
}

/* ── header ──────────────────────────────────────────────────── */
function setHeader(desc){
  if(!CATS.length) return;
  const c = CATS.find(x=>x.id===active) || CATS[0];
  document.getElementById('catIco').innerHTML = svg(iconFor(active));
  document.getElementById('catName').textContent = c.name;
  const list = MODS[active] || [];
  const next = desc || (list[0] ? list[0].desc : '') || '';
  if(next !== catDescEl.textContent){
    catDescEl.textContent = next;
    catDescEl.classList.remove('anim'); void catDescEl.offsetWidth; catDescEl.classList.add('anim');
  }
}

/* ── grid (staggered entrance on category change) ────────────── */
function renderGrid(){
  const list = MODS[active] || [];
  grid.innerHTML = list.map((m,i)=>
    `<div class="mod ${m.enabled?'on':''}" data-i="${i}" data-key="${esc(m.key)}" style="animation-delay:${Math.min(i*22,260)}ms">
       <div class="t">${esc(m.name)}</div><div class="d">${esc(m.desc||'')}</div>
     </div>`).join('');
  grid.querySelectorAll('.mod').forEach(el=>{
    const m = list[+el.dataset.i];
    el.onmouseenter = ()=> setHeader(m.desc);
    el.onclick = e=>{ spawnRipple(el,e); openModule(el,m); };
  });
}
grid.addEventListener('mouseleave', ()=> setHeader());

function spawnRipple(el,e){
  const r = el.getBoundingClientRect();
  const rip = document.createElement('span');
  rip.className='ripple';
  const size = Math.max(r.width,r.height)*1.6;
  rip.style.width = rip.style.height = size+'px';
  rip.style.left = (e.clientX - r.left)+'px';
  rip.style.top  = (e.clientY - r.top)+'px';
  el.appendChild(rip);
  setTimeout(()=>rip.remove(),520);
}

function setActive(catId){
  if(catId===active){ return; }
  resetMorph();
  active = catId;
  side.querySelectorAll('.nav').forEach(n=> n.classList.toggle('active', n.dataset.cat===catId));
  moveIndicator();
  renderGrid();
  setHeader();
}

/* ── module card ⇄ settings morph ─────────────────────────────── */
const panel  = document.getElementById('panel');
const morph  = document.getElementById('morph');
const mTitle = document.getElementById('mTitle');
const mDesc  = document.getElementById('mDesc');
const mBody  = document.getElementById('mBody');

let openMod = null, sourceCard = null, closeTimer = null;
const GAP = 18, PANEL_W = 244, TOP_OFF = 74;

function setGeom(l,t,w,h){
  morph.style.left = l+'px'; morph.style.top = t+'px';
  morph.style.width = w+'px'; morph.style.height = h+'px';
}

/* build the settings rows for a module from its schema fields */
function buildBody(mod){
  let rows = '';
  if(mod.enabledKey != null){
    rows += `<div class="p-row"><span class="p-lbl">Enabled</span><div class="tog${mod.enabled?' on':''}" data-key="${esc(mod.enabledKey)}" data-role="enabled"></div></div>`;
  }
  (mod.settings||[]).forEach(s=>{
    if(s.kind==='color'){
      rows += `<div class="p-row"><span class="p-lbl">${esc(s.label)}</span><div class="dot" title="Open HSV color picker" data-key="${esc(s.key)}" style="background:${esc(s.value||'#8b5cf6')}"></div></div>`;
    } else if(s.kind==='keybind' || s.kind==='enum'){
      const opts=(s.variants||[]).map(v=>`<option value="${esc(v)}"${v===s.value?' selected':''}>${esc(v)}</option>`).join('');
      rows += `<div class="p-row"><span class="p-lbl">${esc(s.label)}</span><select class="m-select" data-key="${esc(s.key)}">${opts}</select></div>`;
    } else if(s.kind==='toggle'){
      rows += `<div class="p-row"><span class="p-lbl">${esc(s.label)}</span><div class="tog${s.value?' on':''}" data-key="${esc(s.key)}" data-role="bool"></div></div>`;
    } else if(s.kind==='number'){
      rows += `<div class="p-row"><span class="p-lbl">${esc(s.label)}</span><span class="m-val m-drag" title="Drag left or right to change" data-key="${esc(s.key)}" data-type="${esc(s.numberType)}" data-value="${esc(s.value)}" data-min="${esc(s.min)}" data-max="${esc(s.max)}">${esc(String(s.value))}</span></div>`;
    } else {
      rows += `<div class="p-row"><span class="p-lbl">${esc(s.label)}</span><span class="m-val">${esc(String(s.value))}</span></div>`;
    }
  });
  return rows || `<div class="p-row"><span class="p-lbl" style="color:var(--text-faint)">No settings</span></div>`;
}
function markCard(key,on){
  const card=[...grid.querySelectorAll('.mod')].find(el=>el.dataset.key===key);
  if(card) card.classList.toggle('on', on);
}

const colorPicker=document.getElementById('colorPicker'),colorWheel=document.getElementById('colorWheel');
const colorCtx=colorWheel.getContext('2d'),colorCursor=document.getElementById('colorCursor');
const colorValue=document.getElementById('colorValue'),colorHex=document.getElementById('colorHex');
const COLOR_SIZE=168,COLOR_RADIUS=84;
let colorH=0,colorS=1,colorV=1,activeColor=null,wheelDragging=false,valueDragging=false;
function hsvRgb(h,s,v){
  const c=v*s,x=c*(1-Math.abs((h/60)%2-1)),m=v-c;let r=0,g=0,b=0;
  if(h<60){r=c;g=x}else if(h<120){r=x;g=c}else if(h<180){g=c;b=x}
  else if(h<240){g=x;b=c}else if(h<300){r=x;b=c}else{r=c;b=x}
  return [r,g,b].map(n=>Math.round((n+m)*255));
}
function rgbHsv(r,g,b){
  r/=255;g/=255;b/=255;const max=Math.max(r,g,b),min=Math.min(r,g,b),d=max-min;let h=0;
  if(d){if(max===r)h=60*((g-b)/d%6);else if(max===g)h=60*((b-r)/d+2);else h=60*((r-g)/d+4);}
  if(h<0)h+=360;return [h,max?d/max:0,max];
}
const rgbHex=(r,g,b)=>'#'+[r,g,b].map(n=>n.toString(16).padStart(2,'0')).join('').toUpperCase();
function drawColorWheel(){
  const image=colorCtx.createImageData(COLOR_SIZE,COLOR_SIZE),data=image.data;
  for(let y=0;y<COLOR_SIZE;y++)for(let x=0;x<COLOR_SIZE;x++){
    const dx=x-COLOR_RADIUS,dy=y-COLOR_RADIUS,d=Math.sqrt(dx*dx+dy*dy),i=(y*COLOR_SIZE+x)*4;
    if(d>COLOR_RADIUS){data[i+3]=0;continue;}
    let h=Math.atan2(dy,dx)*180/Math.PI;if(h<0)h+=360;
    const [r,g,b]=hsvRgb(h,Math.min(1,d/COLOR_RADIUS),colorV);
    data[i]=r;data[i+1]=g;data[i+2]=b;data[i+3]=d>COLOR_RADIUS-1?Math.max(0,(COLOR_RADIUS-d)*255):255;
  }
  colorCtx.putImageData(image,0,0);
}
function refreshColorPicker(commit=false){
  const rad=colorH*Math.PI/180,[r,g,b]=hsvRgb(colorH,colorS,colorV),[vr,vg,vb]=hsvRgb(colorH,colorS,1);
  colorCursor.style.left=COLOR_RADIUS+Math.cos(rad)*colorS*COLOR_RADIUS+'px';
  colorCursor.style.top=COLOR_RADIUS+Math.sin(rad)*colorS*COLOR_RADIUS+'px';colorCursor.style.background=`rgb(${r},${g},${b})`;
  colorValue.style.background=`linear-gradient(to right,#000,rgb(${vr},${vg},${vb}))`;
  colorValue.style.setProperty('--value-pos',colorV*100+'%');const hex=rgbHex(r,g,b);colorHex.textContent=hex;
  colorPicker.style.setProperty('--picker-rgb',`${r},${g},${b}`);
  if(commit&&activeColor){activeColor.dot.style.background=hex;activeColor.setting.value=hex;SEND({type:'config',key:activeColor.dot.dataset.key,value:{r,g,b,a:255}});}
}
function openColorPicker(dot,setting){
  if(!setting)return;const hex=setting.value||'#8B5CF6',n=parseInt(hex.slice(1),16);
  [colorH,colorS,colorV]=rgbHsv((n>>16)&255,(n>>8)&255,n&255);activeColor={dot,setting};
  const rect=dot.getBoundingClientRect();colorPicker.style.left=Math.max(8,Math.min(innerWidth-204,rect.right-196))+'px';
  colorPicker.style.top=Math.max(8,Math.min(innerHeight-230,rect.bottom+7))+'px';
  drawColorWheel();refreshColorPicker();colorPicker.classList.add('show');
}
function closeColorPicker(){colorPicker.classList.remove('show');activeColor=null;wheelDragging=valueDragging=false;}
function pickColorWheel(e){
  const rect=colorWheel.getBoundingClientRect(),x=e.clientX-rect.left-COLOR_RADIUS,y=e.clientY-rect.top-COLOR_RADIUS;
  colorS=Math.min(1,Math.sqrt(x*x+y*y)/COLOR_RADIUS);colorH=Math.atan2(y,x)*180/Math.PI;if(colorH<0)colorH+=360;
  refreshColorPicker(true);
}
function pickColorValue(e){
  const rect=colorValue.getBoundingClientRect();colorV=Math.max(0,Math.min(1,(e.clientX-rect.left)/rect.width));
  drawColorWheel();refreshColorPicker(true);
}
colorWheel.onmousedown=e=>{if(e.button!==0)return;wheelDragging=true;pickColorWheel(e);e.preventDefault();e.stopPropagation();};
colorValue.onmousedown=e=>{if(e.button!==0)return;valueDragging=true;pickColorValue(e);e.preventDefault();e.stopPropagation();};
document.addEventListener('mousemove',e=>{if(wheelDragging)pickColorWheel(e);if(valueDragging)pickColorValue(e);});
document.addEventListener('mouseup',()=>{wheelDragging=false;valueDragging=false;});

function wireBody(){
  mBody.querySelectorAll('.tog[data-key]').forEach(t=>{
    t.onclick = ()=>{
      const on = !t.classList.contains('on');
      t.classList.toggle('on', on);
      SEND({type:'config', key:t.dataset.key, value:on});
      if(t.dataset.role==='enabled' && openMod){ openMod.enabled=on; markCard(openMod.key,on); }
    };
  });
  mBody.querySelectorAll('.m-select').forEach(sel=>{
    sel.onchange = ()=> SEND({type:'config', key:sel.dataset.key, value:sel.value});
  });
  mBody.querySelectorAll('.dot[data-key]').forEach(dot=>{
    dot.onclick=e=>{e.stopPropagation();openColorPicker(dot,(openMod.settings||[]).find(s=>s.key===dot.dataset.key));};
  });
  mBody.querySelectorAll('.m-drag[data-key]').forEach(valueEl=>{
    const min=+valueEl.dataset.min, max=+valueEl.dataset.max;
    const isInt=valueEl.dataset.type==='int';
    const range=Math.max(max-min,1), step=isInt?1:(range<=1?.01:range<=10?.05:range<=100?.1:1);
    const display=value=>isInt?String(Math.round(value)):value.toFixed(step<.1?2:step<1?1:0).replace(/\.0+$/,'');
    let dragging=false,startX=0,startValue=0,lastValue=+valueEl.dataset.value;
    valueEl.textContent=display(lastValue);
    valueEl.style.setProperty('--value-progress',((lastValue-min)/range*100)+'%');
    valueEl.onmousedown=e=>{
      if(e.button!==0)return;
      dragging=true;startX=e.clientX;startValue=lastValue;
      valueEl.classList.add('dragging');e.preventDefault();e.stopPropagation();
    };
    document.addEventListener('mousemove',e=>{
      if(!dragging)return;
      let next=startValue+(e.clientX-startX)*(range/200);
      next=Math.min(max,Math.max(min,Math.round(next/step)*step));
      if(isInt)next=Math.round(next);
      const atLimit=next<=min||next>=max;
      valueEl.classList.toggle('at-limit',atLimit);
      valueEl.style.setProperty('--value-progress',((next-min)/range*100)+'%');
      if(next===lastValue)return;
      lastValue=next;valueEl.dataset.value=next;valueEl.textContent=display(next);
      SEND({type:'config',key:valueEl.dataset.key,value:next});
    });
    document.addEventListener('mouseup',()=>{
      if(!dragging)return;
      dragging=false;valueEl.classList.remove('dragging','at-limit');
      valueEl.classList.remove('settling');void valueEl.offsetWidth;valueEl.classList.add('settling');
      setTimeout(()=>valueEl.classList.remove('settling'),260);
    });
  });
}

function openModule(cardEl, mod){
  clearTimeout(closeTimer);
  if(sourceCard && sourceCard !== cardEl) sourceCard.style.visibility = '';  // free a previous slot
  sourceCard = cardEl;
  openMod = mod;

  mTitle.textContent = mod.name;
  mDesc.textContent  = mod.desc || '';
  mBody.innerHTML = buildBody(mod);
  wireBody();

  const first = cardEl.getBoundingClientRect();
  cardEl.style.visibility = 'hidden';        // leave a blank slot where the card was

  // measure the settings height for this module's rows (offscreen, no transition)
  morph.style.transition = 'none';
  morph.classList.add('active','settings');
  morph.style.left='-9999px'; morph.style.top='0'; morph.style.width=PANEL_W+'px'; morph.style.height='auto';
  const targetH = morph.offsetHeight;

  // snap onto the card, looking exactly like the card
  morph.classList.remove('settings');
  setGeom(first.left, first.top, first.width, first.height);
  void morph.offsetWidth;                     // commit the start frame

  // release transition and fly to the settings position, expanding + morphing
  morph.style.transition = '';
  const p = panel.getBoundingClientRect();
  morph.classList.add('settings');
  setGeom(p.right + GAP, p.top + TOP_OFF, PANEL_W, targetH);
}

function closeModule(){
  closeColorPicker();
  if(!openMod) return;
  const cardEl = sourceCard;
  openMod = null;
  const first = cardEl.getBoundingClientRect();   // still occupies its slot while hidden
  morph.classList.remove('settings');             // shrink + morph back into the card
  setGeom(first.left, first.top, first.width, first.height);
  clearTimeout(closeTimer);
  closeTimer = setTimeout(()=>{
    morph.classList.remove('active');
    if(cardEl) cardEl.style.visibility = '';      // card reappears in its slot
    sourceCard = null;
  }, 460);
}

function resetMorph(){                            // instant teardown (category switch)
  closeColorPicker();
  clearTimeout(closeTimer);
  morph.style.animation = '';
  morph.classList.remove('active','settings');
  if(sourceCard) sourceCard.style.visibility = '';
  sourceCard = null; openMod = null;
}

function shrinkMorph(){                           // shrink + fade the open settings panel
  if(!morph.classList.contains('active')){ resetMorph(); return; }
  clearTimeout(closeTimer);
  openMod = null;
  morph.style.animation = 'menuClose .28s ease both';
  morph.addEventListener('animationend', function h(){
    morph.removeEventListener('animationend', h);
    resetMorph();
  });
}

document.getElementById('mClose').onclick = closeModule;

/* ── menu theme customization ── */
const themePanel = document.getElementById('themePanel');
const THEME_DEFAULT = {accent:0,surface:0,text:0};
const THEME_OPTIONS = {
  accent:['#8b5cf6','#0ea5e9','#14b8a6','#f97316','#ec4899'],
  surface:[
    {swatch:'#211b2c',top:'rgba(33,27,44,.86)',bot:'rgba(20,16,27,.88)',pop:'#1b1626'},
    {swatch:'#101b2c',top:'rgba(16,27,44,.88)',bot:'rgba(8,15,27,.90)',pop:'#0d1726'},
    {swatch:'#102622',top:'rgba(16,38,34,.88)',bot:'rgba(8,23,21,.90)',pop:'#0d211d'},
    {swatch:'#27221c',top:'rgba(39,34,28,.88)',bot:'rgba(24,20,16,.90)',pop:'#211c17'},
    {swatch:'#22242a',top:'rgba(34,36,42,.88)',bot:'rgba(18,19,23,.90)',pop:'#1b1d22'}
  ],
  text:[
    {swatch:'#f2f1f6',main:'#f2f1f6',dim:'#928d9d',faint:'#6c6678'},
    {swatch:'#e8f3ff',main:'#e8f3ff',dim:'#92a9bd',faint:'#62798d'},
    {swatch:'#e8fff8',main:'#e8fff8',dim:'#8eaea5',faint:'#607d75'},
    {swatch:'#fff3e8',main:'#fff3e8',dim:'#b09d8d',faint:'#7e6d60'}
  ]
};
let menuTheme = {...THEME_DEFAULT};
try{ menuTheme={...menuTheme,...JSON.parse(localStorage.getItem('nimbus-theme')||'{}')}; }catch(_){}
function hexRgb(hex){return [1,3,5].map(i=>parseInt(hex.slice(i,i+2),16));}
function applyTheme(save=true){
  const root=document.documentElement.style;
  const accent=THEME_OPTIONS.accent[menuTheme.accent]||THEME_OPTIONS.accent[0];
  const [r,g,b]=hexRgb(accent), surface=THEME_OPTIONS.surface[menuTheme.surface]||THEME_OPTIONS.surface[0];
  const text=THEME_OPTIONS.text[menuTheme.text]||THEME_OPTIONS.text[0];
  root.setProperty('--accent',accent); root.setProperty('--accent-br',`rgb(${Math.min(r+26,255)},${Math.min(g+26,255)},${Math.min(b+26,255)})`);
  root.setProperty('--accent-soft',`rgba(${r},${g},${b},.16)`);
  root.setProperty('--panel-top',surface.top); root.setProperty('--panel-bot',surface.bot); root.setProperty('--pop',surface.pop);
  root.setProperty('--text',text.main); root.setProperty('--text-dim',text.dim); root.setProperty('--text-faint',text.faint);
  document.querySelectorAll('.theme-swatch').forEach(el=>el.classList.toggle('active',+el.dataset.index===menuTheme[el.dataset.group]));
  if(save) try{localStorage.setItem('nimbus-theme',JSON.stringify(menuTheme));}catch(_){}
}
function buildThemeSwatches(group,id){
  const options=THEME_OPTIONS[group];
  document.getElementById(id).innerHTML=options.map((option,index)=>{
    const color=typeof option==='string'?option:option.swatch;
    return `<button class="theme-swatch" data-group="${group}" data-index="${index}" style="background:${color}" title="Select ${group} color"></button>`;
  }).join('');
}
buildThemeSwatches('accent','accentSwatches'); buildThemeSwatches('surface','surfaceSwatches'); buildThemeSwatches('text','textSwatches');
themePanel.querySelectorAll('.theme-swatch').forEach(el=>el.onclick=()=>{menuTheme[el.dataset.group]=+el.dataset.index;applyTheme();});
document.getElementById('themeBtn').onclick=e=>{e.stopPropagation();themePanel.classList.toggle('show');};
document.getElementById('themeReset').onclick=()=>{menuTheme={...THEME_DEFAULT};applyTheme();};
applyTheme(false);

/* click anywhere outside the settings panel / a card dismisses it */
document.addEventListener('mousedown', e=>{
  if(!e.target.closest('#themePanel')&&!e.target.closest('#themeBtn')) themePanel.classList.remove('show');
  if(!e.target.closest('#colorPicker')&&!e.target.closest('.dot')) closeColorPicker();
  if(!openMod) return;                         // opening click fires before openMod is set
  if(e.target.closest('#colorPicker')) return;
  if(e.target.closest('#morph')) return;       // interacting with the settings panel
  if(e.target.closest('.mod'))   return;       // switching to another card (its onclick handles it)
  closeModule();
});

/* ── search ──────────────────────────────────────────────────── */
const sWrap  = document.getElementById('searchWrap');
const sInput = document.getElementById('searchInput');
const sRes   = document.getElementById('sResults');
sInput.addEventListener('focus', ()=>SEND({type:'search_focus'}));
sInput.addEventListener('blur',  ()=>SEND({type:'search_blur'}));
/* The menu is rendered in an off-screen WebView. Its mouse input is forwarded
   by the host, but Windows keyboard focus stays with the game. The host calls
   this entry point with the keys it observes while this input is focused. */
window.__newbaseSearchKey = (key, text='') => {
  if(document.activeElement !== sInput) return false;
  if(key === 'Backspace'){
    const a=sInput.selectionStart, b=sInput.selectionEnd;
    if(a !== b) sInput.setRangeText('',a,b,'end');
    else if(a > 0) sInput.setRangeText('',a-1,a,'end');
  }else if(key === 'Delete'){
    const a=sInput.selectionStart, b=sInput.selectionEnd;
    sInput.setRangeText('',a,b === a ? a+1 : b,'end');
  }else if(key === 'Escape'){
    sWrap.classList.remove('show'); sInput.blur(); return true;
  }else if(text){
    sInput.setRangeText(text,sInput.selectionStart,sInput.selectionEnd,'end');
  }else return false;
  sInput.dispatchEvent(new Event('input',{bubbles:true}));
  return true;
};
document.getElementById('searchBtn').onclick = ()=>{
  sWrap.classList.add('show'); sInput.value=''; sRes.classList.remove('show'); sRes.innerHTML='';
  setTimeout(()=>sInput.focus(),60);
};
sWrap.onclick = e=>{ if(e.target===sWrap) sWrap.classList.remove('show'); };
sInput.oninput = ()=>{
  const q = sInput.value.trim().toLowerCase();
  if(!q){ sRes.classList.remove('show'); return; }
  const hits=[];
  for(const c of CATS)
    for(const m of (MODS[c.id]||[]))
      if(m.name.toLowerCase().includes(q)) hits.push({catId:c.id, key:m.key, name:m.name});
  sRes.classList.add('show');
  sRes.innerHTML = '<div class="lbl">Results</div>' + (hits.length
    ? hits.slice(0,6).map((h,i)=>`<div class="s-item" data-cat="${esc(h.catId)}" data-key="${esc(h.key)}" style="animation-delay:${i*35}ms"><span class="cat">Modules</span><span class="dotsep">•</span><span>${esc(h.name)}</span></div>`).join('')
    : '<div class="s-empty">No modules found</div>');
  sRes.querySelectorAll('.s-item').forEach(it=>{
    it.onclick = ()=>{
      setActive(it.dataset.cat);
      const m = (MODS[active]||[]).find(x=>x.key===it.dataset.key);
      sWrap.classList.remove('show');
      if(m) setTimeout(()=>{
        const cardEl = [...grid.querySelectorAll('.mod')].find(el=> el.dataset.key === m.key);
        if(cardEl) openModule(cardEl, m);
      }, 220);
    };
  });
};

/* ── Insert / native toggle : bubbly open, shrink + fade close ── */
const stage = document.querySelector('.stage');
let menuVisible = true;
function applyMenu(v){
  if(v === menuVisible) return;
  menuVisible = v;
  stage.style.animation = 'none'; void stage.offsetWidth;   // restart cleanly
  if(v){
    stage.style.display = '';
    stage.classList.remove('cloud-opening'); void stage.offsetWidth; stage.classList.add('cloud-opening');
    stage.style.animation = 'menuOpen .42s var(--spring) both';
  }else{
    stage.classList.remove('cloud-opening');
    sWrap.classList.remove('show');
    shrinkMorph();
    stage.style.animation = 'menuClose .28s ease both';
  }
}
function toggleMenu(){ applyMenu(!menuVisible); SEND({type:'visibility', visible:menuVisible}); }
window.__newbaseSetVisible = v => { applyMenu(!!v); return true; };
stage.addEventListener('animationend', e=>{
  if(e.target === stage && !menuVisible) stage.style.display = 'none';   // hide after shrink
});

document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ sWrap.classList.remove('show'); closeModule(); }
  if(e.key==='Insert'){ e.preventDefault(); toggleMenu(); }
});

/* ── init ────────────────────────────────────────────────────── */
renderSide();
renderGrid();
setHeader();
requestAnimationFrame(()=> requestAnimationFrame(moveIndicator));
SEND({type:'ready'});
</script>
